esphome:
  name: dedietrich-ble
  friendly_name: De Dietrich Heat Pump

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

logger:
  level: INFO

external_components:
  - source: github://d-lebed/esphome-bdr-ble
    components: [bdr_ble]

esp32_ble:
  io_capability: keyboard_only

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  - mac_address: !secret ble_mac
    id: boiler_ble

bdr_ble:
  id: boiler_hub
  ble_client_id: boiler_ble
  pin: !secret ble_pin
  node_id: 1
  auth_level: 4
  log_snapshot: false

switch:
  - platform: ble_client
    ble_client_id: boiler_ble
    name: "Heat Pump BLE Connect"
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

text_sensor:
  - platform: bdr_ble
    status:
      name: "BLE Status"

  # Current error (0x5047 block) — mirrors the code shown on the HMI.
  # "Error Severity" is a friendly label driven by the numeric 0x5047:03 sensor
  # (see the on_value handler in the sensor section below).
  - platform: template
    name: "Error Severity"
    id: error_severity_txt
  # 0x5047:07 -> third-party (e.g. outdoor unit) error string, when present
  - platform: bdr_ble
    parameter: "0x5047:07"
    name: "Error Details"
  # Combined HMI-style code (A/H/E xx.xx) built from the numeric 0x5047 sensors.
  - platform: template
    name: "Error Code"
    id: current_error_txt
    update_interval: 10s
    lambda: |-
      // The HMI uses decimal code parts. The raw U16 packs them as two bytes:
      // H00.51 is raw 0x0033 (0x33 hex = 51 decimal), so print each byte with %02d,
      // not %02X. Code 0x0000 is a valid H00.00; only NaN/0xFFFF mean no code.
      float sev = id(current_error_severity_num).state;
      float code = id(current_error_code).state;
      bool no_sev = std::isnan(sev) || sev >= 255.0f;
      bool no_code = std::isnan(code) || code >= 65535.0f;
      if (no_sev && no_code) {
        return std::string("None");
      }
      if (no_code) {
        return std::string("Unknown");
      }
      int raw = static_cast<int>(code + 0.5f);
      int hi = (raw >> 8) & 0xFF;
      int lo = raw & 0xFF;
      const char *cat = "?";
      if (!std::isnan(sev)) {
        int s = static_cast<int>(sev + 0.5f);
        if (s == 0) {
          cat = "E";  // Locking
        } else if (s == 3) {
          cat = "H";  // Blocking / regulating shutdown
        } else if (s == 6) {
          cat = "A";  // Warning
        }
      }
      char buf[16];
      snprintf(buf, sizeof(buf), "%s%02d.%02d", cat, hi, lo);
      return std::string(buf);

  # Template text sensors driven by the numeric AM012 / AM014 sensors below.
  # NOTE: the bdr_ble text_sensor already publishes a descriptive enum label,
  # which is why the previous `x == "3"` mapping never matched. These templates
  # are fed from the numeric sensor `on_value` handlers instead.
  - platform: template
    name: "Operating Status Text"
    id: operating_status_txt

  - platform: template
    name: "Operating sub Status Text"
    id: sub_status_txt

  # Friendly three-way valve position (AM037 is kept internal, see on_value).
  - platform: template
    name: "Three way valve status"
    id: three_way_valve_txt

  # Current DHW activity (DM019 is kept internal, see on_value).
  - platform: template
    name: "DHW Activity"
    id: dhw_activity_txt

sensor:
  # Fast group (polled every 10s)
  - platform: bdr_ble
    update_interval: 10s
    sensors:
      # --- Core Temperatures, Pressure & Status ---
      - parameter: AM027
        name: "Outside Temperature"
      - parameter: AM016
        name: "Flow Temperature"
      - parameter: DM001
        name: "DHW Temperature"
      - parameter: DM019
        name: "DHW Activity Raw"
        id: dhw_activity_code
        internal: true
        on_value:
          then:
            - lambda: |-
                int v = static_cast<int>(x + 0.5f);
                switch (v) {
                  case 0: id(dhw_activity_txt).publish_state("Off"); break;
                  case 1: id(dhw_activity_txt).publish_state("Eco"); break;
                  case 2: id(dhw_activity_txt).publish_state("Comfort"); break;
                  case 3: id(dhw_activity_txt).publish_state("Thermal disinfection"); break;
                  default: id(dhw_activity_txt).publish_state(("Unknown (" + std::to_string(v) + ")").c_str()); break;
                }
      - parameter: AM019
        name: "Water Pressure"
      # AM012 / AM014 are kept internal: they still poll and feed the
      # "Operating Status Text" / "Operating sub Status Text" template sensors
      # via on_value, but do not appear as numeric entities in Home Assistant.
      - parameter: AM012
        name: "Operating Status Code"
        id: operating_status_code
        internal: true
        on_value:
          then:
            - lambda: |-
                int v = static_cast<int>(x + 0.5f);
                switch (v) {
                  case 0: id(operating_status_txt).publish_state("0:Standby"); break;
                  case 1: id(operating_status_txt).publish_state("1:Heat demand pending"); break;
                  case 2: id(operating_status_txt).publish_state("2:Heat production starting"); break;
                  case 3: id(operating_status_txt).publish_state("3:CH heating"); break;
                  case 4: id(operating_status_txt).publish_state("4:DHW heating"); break;
                  case 5: id(operating_status_txt).publish_state("5:Heat production stopping"); break;
                  case 6: id(operating_status_txt).publish_state("6:Pump post-run"); break;
                  case 7: id(operating_status_txt).publish_state("7:Cooling"); break;
                  case 8: id(operating_status_txt).publish_state("8:Waiting for start conditions"); break;
                  case 9: id(operating_status_txt).publish_state("9:Blocking active"); break;
                  case 10: id(operating_status_txt).publish_state("10:Locking active"); break;
                  case 11: id(operating_status_txt).publish_state("11:Commissioning - low load"); break;
                  case 12: id(operating_status_txt).publish_state("12:Commissioning - max CH power"); break;
                  case 13: id(operating_status_txt).publish_state("13:Commissioning - max DHW power"); break;
                  case 14: id(operating_status_txt).publish_state("14:Commissioning - custom power"); break;
                  case 15: id(operating_status_txt).publish_state("15:Manual CH heat demand"); break;
                  case 16: id(operating_status_txt).publish_state("16:Frost protection active"); break;
                  case 17: id(operating_status_txt).publish_state("17:De-aeration"); break;
                  case 18: id(operating_status_txt).publish_state("18:Internal cooling"); break;
                  case 19: id(operating_status_txt).publish_state("19:Resetting"); break;
                  case 20: id(operating_status_txt).publish_state("20:Filling installation"); break;
                  case 21: id(operating_status_txt).publish_state("21:Halted - power cycle required"); break;
                  case 22: id(operating_status_txt).publish_state("22:Forced calibration"); break;
                  case 23: id(operating_status_txt).publish_state("23:Factory mode"); break;
                  case 24: id(operating_status_txt).publish_state("24:Hydraulic balancing"); break;
                  case 200: id(operating_status_txt).publish_state("200:Service tool control"); break;
                  case 254: id(operating_status_txt).publish_state("254:Undefined"); break;
                  default: id(operating_status_txt).publish_state(("Unknown (" + std::to_string(v) + ")").c_str()); break;
                }
      - parameter: AM014
        name: "Operating sub Status Code"
        id: sub_status_code
        internal: true
        on_value:
          then:
            - lambda: |-
                int v = static_cast<int>(x + 0.5f);
                switch (v) {
                  case 0: id(sub_status_txt).publish_state("0:Standby / waiting"); break;
                  case 1: id(sub_status_txt).publish_state("1:Anti-cycle wait"); break;
                  case 2: id(sub_status_txt).publish_state("2:External hydraulic valve open"); break;
                  case 3: id(sub_status_txt).publish_state("3:Pump starting"); break;
                  case 4: id(sub_status_txt).publish_state("4:Waiting for temperature start conditions"); break;
                  case 30: id(sub_status_txt).publish_state("30:Target setpoint control"); break;
                  case 31: id(sub_status_txt).publish_state("31:Reduced setpoint (temperature limit)"); break;
                  case 32: id(sub_status_txt).publish_state("32:Power control"); break;
                  case 33: id(sub_status_txt).publish_state("33:Gradient control level 1"); break;
                  case 34: id(sub_status_txt).publish_state("34:Gradient control level 2"); break;
                  case 35: id(sub_status_txt).publish_state("35:Gradient control level 3 / blocking"); break;
                  case 37: id(sub_status_txt).publish_state("37:Stabilisation time"); break;
                  case 38: id(sub_status_txt).publish_state("38:Cold start"); break;
                  case 39: id(sub_status_txt).publish_state("39:Resuming CH after DHW"); break;
                  case 40: id(sub_status_txt).publish_state("40:Removing heat demand"); break;
                  case 46: id(sub_status_txt).publish_state("46:Automatic filling - empty installation"); break;
                  case 47: id(sub_status_txt).publish_state("47:Automatic filling - low pressure"); break;
                  case 48: id(sub_status_txt).publish_state("48:Flow setpoint reduced (thermal protection)"); break;
                  case 60: id(sub_status_txt).publish_state("60:Pump post-run"); break;
                  case 61: id(sub_status_txt).publish_state("61:Pump off"); break;
                  case 62: id(sub_status_txt).publish_state("62:Hydraulic valve closed"); break;
                  case 63: id(sub_status_txt).publish_state("63:Anti-cycle timer"); break;
                  case 65: id(sub_status_txt).publish_state("65:HP relieved, backup on"); break;
                  case 66: id(sub_status_txt).publish_state("66:HP flow over max, backup on"); break;
                  case 67: id(sub_status_txt).publish_state("67:HP off - external condition, backup on"); break;
                  case 68: id(sub_status_txt).publish_state("68:HP off - hybrid mode, backup on"); break;
                  case 69: id(sub_status_txt).publish_state("69:Defrosting (heat pump only)"); break;
                  case 70: id(sub_status_txt).publish_state("70:Defrosting (backup only)"); break;
                  case 71: id(sub_status_txt).publish_state("71:Defrosting (HP + backup)"); break;
                  case 72: id(sub_status_txt).publish_state("72:Source pump post-run + backup"); break;
                  case 73: id(sub_status_txt).publish_state("73:HP flow over maximum temperature"); break;
                  case 74: id(sub_status_txt).publish_state("74:Source pump post-run"); break;
                  case 75: id(sub_status_txt).publish_state("75:HP off - humidity sensor"); break;
                  case 76: id(sub_status_txt).publish_state("76:HP off - water flow"); break;
                  case 78: id(sub_status_txt).publish_state("78:Setpoint limited - humidity sensor"); break;
                  case 79: id(sub_status_txt).publish_state("79:HP and backup relieved for heating/DHW"); break;
                  case 80: id(sub_status_txt).publish_state("80:HP relieved for cooling"); break;
                  case 81: id(sub_status_txt).publish_state("81:HP off - outside temperature"); break;
                  case 82: id(sub_status_txt).publish_state("82:HP off - underrun"); break;
                  case 83: id(sub_status_txt).publish_state("83:De-aeration pump on, valve CH"); break;
                  case 84: id(sub_status_txt).publish_state("84:De-aeration pump on, valve DHW"); break;
                  case 85: id(sub_status_txt).publish_state("85:De-aeration pump off, valve CH"); break;
                  case 86: id(sub_status_txt).publish_state("86:De-aeration pump off, valve DHW"); break;
                  case 88: id(sub_status_txt).publish_state("88:BL input - backup limited"); break;
                  case 89: id(sub_status_txt).publish_state("89:BL input - heat pump limited"); break;
                  case 90: id(sub_status_txt).publish_state("90:BL input - backup and HP limited"); break;
                  case 91: id(sub_status_txt).publish_state("91:BL input - low tariff"); break;
                  case 92: id(sub_status_txt).publish_state("92:BL input - PV, HP only"); break;
                  case 93: id(sub_status_txt).publish_state("93:BL input - PV, HP + backup"); break;
                  case 94: id(sub_status_txt).publish_state("94:BL input - Smart Grid"); break;
                  case 95: id(sub_status_txt).publish_state("95:Waiting for sufficient water pressure"); break;
                  case 96: id(sub_status_txt).publish_state("96:No heat producer available"); break;
                  case 97: id(sub_status_txt).publish_state("97:Minimum power increased"); break;
                  case 98: id(sub_status_txt).publish_state("98:Maximum power reduced"); break;
                  case 102: id(sub_status_txt).publish_state("102:Free cooling, CH pump inactive"); break;
                  case 103: id(sub_status_txt).publish_state("103:Free cooling, CH pump active"); break;
                  case 104: id(sub_status_txt).publish_state("104:Source pump pre-run"); break;
                  case 106: id(sub_status_txt).publish_state("106:Blocking input active"); break;
                  case 107: id(sub_status_txt).publish_state("107:Compressor minimum-on time"); break;
                  case 108: id(sub_status_txt).publish_state("108:Evaporator defrost protection - curative"); break;
                  case 109: id(sub_status_txt).publish_state("109:Evaporator defrost protection - preventive"); break;
                  case 200: id(sub_status_txt).publish_state("200:Initialising complete"); break;
                  case 201: id(sub_status_txt).publish_state("201:Initialising device storage"); break;
                  case 202: id(sub_status_txt).publish_state("202:Initialising identifiers"); break;
                  case 203: id(sub_status_txt).publish_state("203:Initialising blocking parameters"); break;
                  case 204: id(sub_status_txt).publish_state("204:Initialising safety unit"); break;
                  case 205: id(sub_status_txt).publish_state("205:Initialising blocking"); break;
                  case 254: id(sub_status_txt).publish_state("254:Undefined"); break;
                  case 255: id(sub_status_txt).publish_state("255:Reset wait time"); break;
                  default: id(sub_status_txt).publish_state(("Unknown (" + std::to_string(v) + ")").c_str()); break;
                }
      - parameter: AM002
        name: "Silent Mode Active"
      - parameter: AM037
        name: "Three Way Valve Raw"
        id: three_way_valve
        internal: true
        on_value:
          then:
            - lambda: |-
                int v = static_cast<int>(x + 0.5f);
                switch (v) {
                  case 0: id(three_way_valve_txt).publish_state("CH"); break;
                  case 1: id(three_way_valve_txt).publish_state("DHW"); break;
                  case 2: id(three_way_valve_txt).publish_state("None"); break;
                  default: id(three_way_valve_txt).publish_state("Unknown"); break;
                }

      # --- Flow temperatures ---
      - parameter: AM101
        name: "Internal system flow temperature setpoint in °C"
      - parameter: AM016
        name: "Flow temperature of appliance. in °C"
      - parameter: HM001
        name: "Heat pump flow temperature °C"
      - parameter: HM002
        name: "Heat pump return temperature °C"
      - parameter: HM003
        name: "Heat pump flow temperature setpoint in °C"

      # --- Compressor ---
      - parameter: HM008
        name: "Compressor turned on"
      - parameter: AM010
        name: "Compressor speed %"
      - parameter: HM030
        name: "Request to start compressor"
      - parameter: HM009
        name: "Heat pump defrost function in progress"

      # --- BL1 / BL2 & Smart Grid Status ---
      - parameter: HM004
        name: "BL1 Contact Position"
      - parameter: HM005
        name: "BL2 Contact Position"

      # --- Errors / Faults ---
      # The HMI error code lives in the 0x5047 "Current Error Status" block:
      #   0x5047:01 = generic code (two decimal bytes packed into a U16)
      #   0x5047:03 = severity (0 Locking / 3 Blocking / 6 Warning, 255 = no error)
      # NOTE: 0x5047:00 is the struct entry count (constant 4), not the number of
      # active errors, so it is not used.
      # AM004/AM005 (0x5004/0x5005) are NOT HMI error codes: they return 0xFF
      # when idle and are not part of the manual's error table, so they are gone.
      - parameter: "0x5047:01"
        name: "Current Error Code Raw"
        id: current_error_code
        internal: true
      - parameter: "0x5047:03"
        name: "Current Error Severity Code"
        id: current_error_severity_num
        internal: true
        on_value:
          then:
            - lambda: |-
                int v = static_cast<int>(x + 0.5f);
                switch (v) {
                  case 0: id(error_severity_txt).publish_state("Locking (E)"); break;
                  case 3: id(error_severity_txt).publish_state("Blocking (H)"); break;
                  case 6: id(error_severity_txt).publish_state("Warning (A)"); break;
                  case 255: id(error_severity_txt).publish_state("None"); break;
                  default: id(error_severity_txt).publish_state("Unknown"); break;
                }

binary_sensor:
  - platform: bdr_ble
    update_interval: 10s
    binary_sensors:
      - parameter: HM012
        name: "First Stage Backup Operation"

number:
  - platform: bdr_ble
    update_interval: 30s
    numbers:
      # --- DHW Controls ---
      - parameter: DP070
        name: "DHW Comfort Setpoint"
        min_value: 35
        max_value: 65
        step: 0.5
        mode: box
      - parameter: DP080
        name: "DHW Eco Setpoint"
        min_value: 10
        max_value: 60
        step: 0.5
        mode: box
      - parameter: DP120
        name: "DHW Hysteresis"
        min_value: 0
        max_value: 40
        step: 0.5
        mode: box

      # --- PV / Smart Grid / BL1-BL2 Temperature Boost Offsets ---
      - parameter: HP092
        name: "PV ⁄ Smart Grid DHW Offset"
        min_value: 0
        max_value: 20
        step: 0.5
        mode: box
      - parameter: HP091
        name: "PV ⁄ Smart Grid Heating Offset"
        min_value: 0
        max_value: 15
        step: 0.5
        mode: box
      - parameter: HP213
        name: "PV ⁄ Smart Grid Cooling Offset"
        min_value: 0
        max_value: 10
        step: 0.5
        mode: box

      # --- Central Heating Room & Flow Setpoints ---
      - parameter: CP080
        name: "CH Room Comfort Setpoint"
        min_value: 15
        max_value: 28
        step: 0.5
        mode: box
      - parameter: CP510
        name: "CH Temporary Room Setpoint"
        min_value: 15
        max_value: 28
        step: 0.5
        mode: box
      - parameter: CP200
        name: "CH Manual Room Setpoint"
        min_value: 15
        max_value: 28
        step: 0.5
        mode: box
      - parameter: CP060
        name: "CH Holiday Room Setpoint"
        min_value: 10
        max_value: 22
        step: 0.5
        mode: box
      - parameter: CP010
        name: "CH Flow Temperature Setpoint"
        min_value: 20
        max_value: 60
        step: 0.5
        mode: box
      - parameter: CP000
        name: "CH Max Flow Temperature"
        min_value: 25
        max_value: 65
        step: 1
        mode: box
      - parameter: CP260
        name: "CH Min Flow Temperature"
        min_value: 15
        max_value: 45
        step: 1
        mode: box

      # --- CH Heat Curve ---
      - parameter: CP210
        name: "CH Heat Curve Comfort Base Temp"
        min_value: 15
        max_value: 30
        step: 0.5
        mode: box
      - parameter: CP220
        name: "CH Heat Curve Reduced Base Temp"
        min_value: 10
        max_value: 25
        step: 0.5
        mode: box
      - parameter: CP230
        name: "CH Heating Curve Slope"
        min_value: 0
        max_value: 40
        step: 1
        mode: box

      # --- Heat Pump Backup & Limits ---
      - parameter: HP000
        name: "Bivalent Temperature"
        min_value: -20
        max_value: 15
        step: 1
        mode: box
      - parameter: HP002
        name: "Max HP Flow Temperature"
        min_value: 30
        max_value: 65
        step: 1
        mode: box

      # --- Low Noise / Silent Mode Schedule & Limits ---
      # Raw values are 10-minute slots since midnight (0..143 = 00:00..23:50).
      # These stay internal; the time pickers below convert to/from HH:MM.
      - parameter: HP094
        name: "Low Noise Start Time Raw"
        id: low_noise_start_raw
        internal: true
        min_value: 0
        max_value: 143
        step: 1
        mode: box
      - parameter: HP095
        name: "Low Noise Stop Time Raw"
        id: low_noise_stop_raw
        internal: true
        min_value: 0
        max_value: 143
        step: 1
        mode: box

datetime:
  # Device stores 10-minute slots since midnight, so picker values are snapped
  # to the nearest 10 minutes on write.
  - platform: template
    type: time
    name: "Low Noise Start Time"
    id: low_noise_start_time
    update_interval: 30s
    lambda: |-
      float raw = id(low_noise_start_raw).state;
      if (std::isnan(raw)) {
        return {};
      }
      int mins = static_cast<int>(raw + 0.5f) * 10;
      ESPTime t{};
      t.hour = mins / 60;
      t.minute = mins % 60;
      t.second = 0;
      return t;
    set_action:
      - lambda: |-
          int mins = x.hour * 60 + x.minute;
          int raw = (mins + 5) / 10;  // nearest 10-minute slot
          if (raw > 143) raw = 143;
          id(low_noise_start_raw).make_call().set_value(static_cast<float>(raw)).perform();
          id(low_noise_start_raw).publish_state(static_cast<float>(raw));

  - platform: template
    type: time
    name: "Low Noise Stop Time"
    id: low_noise_stop_time
    update_interval: 30s
    lambda: |-
      float raw = id(low_noise_stop_raw).state;
      if (std::isnan(raw)) {
        return {};
      }
      int mins = static_cast<int>(raw + 0.5f) * 10;
      ESPTime t{};
      t.hour = mins / 60;
      t.minute = mins % 60;
      t.second = 0;
      return t;
    set_action:
      - lambda: |-
          int mins = x.hour * 60 + x.minute;
          int raw = (mins + 5) / 10;  // nearest 10-minute slot
          if (raw > 143) raw = 143;
          id(low_noise_stop_raw).make_call().set_value(static_cast<float>(raw)).perform();
          id(low_noise_stop_raw).publish_state(static_cast<float>(raw));

select:
  - platform: bdr_ble
    update_interval: 30s
    selects:
      - parameter: DP200
        name: "DHW Operating Mode"
      - parameter: DP004
        # "Legionella calor." in the installation manual.
        name: "DHW Thermal Disinfection"
      - parameter: DP051
        name: "DHW Eco/Comfort Management"
      - parameter: CP320
        name: "CH Zone Operating Mode"
      - parameter: CP570
        name: "CH Time Program"
      - parameter: HP058
        name: "HP Silent Mode Level"
      - parameter: AP001
        name: "BL1 Blocking Input Function"
      - parameter: AP098
        name: "BL1 Input Contact Logic"
      - parameter: AP100
        name: "BL2 Input Function"
      - parameter: AP099
        name: "BL2 Input Contact Logic"
      - parameter: AP055
        name: "PV input contact configuration"
